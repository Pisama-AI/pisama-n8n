name: Publish engine to PyPI

on:
  push:
    tags:
      - "engine-v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e "engine[test]"
      - run: python -m pytest -q
        working-directory: engine

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#engine-v}"
          PACKAGE_VERSION=$(grep -m1 '^version = ' engine/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
        working-directory: engine
      - run: python -m twine check dist/*
        working-directory: engine
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: engine/dist/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        artifact: [wheel, sdist]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Select exact ${{ matrix.artifact }} artifact
        id: package
        shell: bash
        run: |
          shopt -s nullglob
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            packages=(dist/*.whl)
          else
            packages=(dist/*.tar.gz)
          fi
          test "${#packages[@]}" -eq 1
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"
      - name: Install exact ${{ matrix.artifact }} artifact
        run: python -m pip install --quiet "${{ steps.package.outputs.path }}"
      - name: Smoke test installed artifact
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#engine-v}" python - <<'PY'
          import os
          from importlib.metadata import version

          from pisama_n8n_engine import analyze

          assert version("pisama-n8n-engine") == os.environ["EXPECTED_VERSION"]
          report = analyze()
          assert report.detections == []
          print(f"pisama-n8n-engine {version('pisama-n8n-engine')} artifact smoke test passed")
          PY

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: engine/dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: engine/dist/
